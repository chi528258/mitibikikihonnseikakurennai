<style>
:root{--rose:#a9687a;--pink:#f6e6e8;--cream:#fffaf5;--ink:#51434a;--line:#eee2df}

<header><div class="brand">michibiki 〜みちびき〜</div><h1>総合鑑定書作成</h1><div class="sub">生年月日は最初に一度入力するだけ</div></header>
<main>
<section class="entry"><h2>お客様情報</h2><div class="fields">
<label>お名前<input id="sharedName" placeholder="例：山田 花子"></label>
<label>生年月日<input id="sharedBirth" type="date"></label>
<label>出生地（都道府県）<select id="sharedPlace"><option value="">都道府県を選択</option><option>北海道</option><option>青森県</option><option>岩手県</option><option>宮城県</option><option>秋田県</option><option>山形県</option><option>福島県</option><option>茨城県</option><option>栃木県</option><option>群馬県</option><option>埼玉県</option><option>千葉県</option><option>東京都</option><option>神奈川県</option><option>新潟県</option><option>富山県</option><option>石川県</option><option>福井県</option><option>山梨県</option><option>長野県</option><option>岐阜県</option><option>静岡県</option><option>愛知県</option><option>三重県</option><option>滋賀県</option><option>京都府</option><option>大阪府</option><option>兵庫県</option><option>奈良県</option><option>和歌山県</option><option>鳥取県</option><option>島根県</option><option>岡山県</option><option>広島県</option><option>山口県</option><option>徳島県</option><option>香川県</option><option>愛媛県</option><option>高知県</option><option>福岡県</option><option>佐賀県</option><option>長崎県</option><option>熊本県</option><option>大分県</option><option>宮崎県</option><option>鹿児島県</option><option>沖縄県</option></select></label>
</div><button class="primary" id="generate">2つの鑑定書を作成</button><p class="hint">※恋愛鑑定書の「結婚したらどんな性格？」は、第一命星を選択してから作成してください。下の恋愛鑑定欄で選べます。</p><div class="toolbar"><button id="saveBasic">基本性格鑑定書をPNG保存</button><button id="printBasic">基本性格鑑定書をPDF保存</button><button id="copyBasic">基本性格鑑定文をコピー</button><button id="saveLove">恋愛鑑定書をPNG保存</button></div><div class="status" id="status">生年月日を入力して「2つの鑑定書を作成」を押してください。</div></section>
<div class="outputs">
<section class="panel"><h2>① 基本性格鑑定書</h2><p>数秘術・太陽星座・月星座・日干・地支</p><iframe id="basicFrame" class="frame" title="基本性格鑑定書"></iframe></section>
<section class="panel"><h2>② 恋愛鑑定書</h2><p>恋愛タイプ・結婚タイプなど。結婚タイプの第一命星は下の選択欄から指定してください。</p><iframe id="loveFrame" class="frame" title="恋愛鑑定書"></iframe></section>
</div></main>

function decodeHTML(b64){const bin=atob(b64),bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return new TextDecoder('utf-8').decode(bytes)}
const basicFrame=document.getElementById('basicFrame'),loveFrame=document.getElementById('loveFrame');
basicFrame.srcdoc=decodeHTML(BASIC);loveFrame.srcdoc=decodeHTML(LOVE);
window.addEventListener('message',e=>{if(e.data?.type==='michi-resize'&&e.source){const f=e.source===basicFrame.contentWindow?basicFrame:e.source===loveFrame.contentWindow?loveFrame:null;if(f)f.style.height=Math.max(700,Math.min(12000,e.data.height+20))+'px';}});
function childDoc(frame){return frame.contentDocument||frame.contentWindow.document}
document.getElementById('generate').addEventListener('click',()=>{
 const birth=document.getElementById('sharedBirth').value;if(!birth){alert('生年月日を入力してください');return;}
 const name=document.getElementById('sharedName').value.trim();const place=document.getElementById('sharedPlace').value;
 try{
  const b=childDoc(basicFrame);b.getElementById('name').value=name;b.getElementById('birth').value=birth;if(b.getElementById('place'))b.getElementById('place').value=place;b.defaultView.make();
  const l=childDoc(loveFrame);l.getElementById('name').value=name;l.getElementById('birth').value=birth;
  if(l.getElementById('star')&&!l.getElementById('star').value){document.getElementById('status').textContent='基本性格鑑定書を作成しました。恋愛鑑定書の第一命星を選択して、もう一度作成してください。';loveFrame.scrollIntoView({behavior:'smooth',block:'start'});return;}
  l.defaultView.makeReport();document.getElementById('status').textContent='基本性格鑑定書・恋愛鑑定書を作成しました。';
 }catch(err){console.error(err);alert('鑑定書の作成中にエラーが発生しました。ページを再読み込みしてお試しください。');}
});
document.getElementById('saveBasic').addEventListener('click',()=>{try{childDoc(basicFrame).getElementById('imageSave').click()}catch(e){alert('先に鑑定書を作成してください')}});
document.getElementById('printBasic').addEventListener('click',()=>{try{childDoc(basicFrame).defaultView.print()}catch(e){alert('先に鑑定書を作成してください')}});
document.getElementById('copyBasic').addEventListener('click',()=>{try{childDoc(basicFrame).getElementById('copy').click()}catch(e){alert('先に鑑定書を作成してください')}});
document.getElementById('saveLove').addEventListener('click',()=>{try{childDoc(loveFrame).defaultView.savePNG()}catch(e){alert('先に恋愛鑑定書を作成してください')}});
</script></body></html>
